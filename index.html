<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakovata — Link Önizleme</title>
  <script src="https://js.pusher.com/7.0/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f;
      --border: #26272e;
      --text: #e8e8ed;
      --muted: #8b8b9a;
      --accent: #53fc18;
      --radius: 14px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      padding: 10px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .status-dot.connected    { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .status-dot.disconnected { background: #ef4444; }
    .app-body { flex: 1; display: flex; overflow: hidden; }
    .preview-pane {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 14px; }
    .row:empty { display: none; }
    .yt-card {
      display: block;
      width: 380px;
      background: transparent;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s ease;
      animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .yt-card:hover { transform: translateY(-3px); }
    .yt-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: var(--radius);
    }
    .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .yt-info { padding: 10px 4px 0; }
    .yt-title {
      font-size: 15px; font-weight: 600; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .yt-author { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .v-card {
      position: relative;
      width: 220px;
      height: 391px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .v-card iframe,
    .v-card video {
      width: 100%; height: 100%; border: none; display: block;
      background: #000; object-fit: contain;
    }
    .v-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .instagram-media {
      margin: 0 !important; min-width: 0 !important;
      width: 100% !important; border-radius: var(--radius) !important;
    }
    .tw-card {
      position: relative;
      width: 300px;
      height: 225px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tw-card .twitter-container {
      width: 100%; height: 100%;
      overflow-y: auto; overflow-x: hidden;
      background: #000;
    }
    .tw-card .twitter-tweet { margin: 0 !important; }
    .steam-card {
      display: block;
      width: 220px;
      height: 103px;
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      background: linear-gradient(135deg, #1b2838, #2a475e);
      transition: transform 0.2s ease;
      animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .steam-card:hover { transform: translateY(-3px); }
    .steam-card img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .steam-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c7d5e0;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 8px;
      pointer-events: none;
    }
    .discord-card {
      position: relative;
      width: 220px;
      height: 160px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .discord-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .yt-card, .steam-card, .discord-card { transition: transform 0.2s ease, opacity 0.25s ease; }
    .v-card, .tw-card { transition: opacity 0.25s ease, filter 0.25s ease; }
    .clicked { filter: grayscale(1); opacity: 0.4; }
    .leaving { opacity: 0 !important; transform: scale(0.95); transition: opacity 0.4s ease, transform 0.4s ease; }
    .open-btn {
      position: absolute; top: 6px; right: 6px; z-index: 5;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.65); color: #fff; text-decoration: none;
      font-size: 14px; line-height: 1;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .open-btn:hover { background: rgba(0,0,0,0.9); }
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      animation: fadeIn 0.2s ease;
    }
    .fullscreen-overlay img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .fullscreen-close {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .fullscreen-close:hover { background: rgba(255, 255, 255, 0.25); }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #33343c; border-radius: 3px; }
    @media (max-width: 900px) {
      .yt-card { width: 320px; }
      .v-card { width: 190px; height: 338px; }
      .tw-card { width: 260px; height: 195px; }
    }
    @media (max-width: 700px) {
      .preview-pane { padding: 12px; }
      .yt-card { width: 100%; }
      .v-card { width: calc(50% - 7px); height: auto; aspect-ratio: 9 / 16; }
      .tw-card { width: 100%; height: auto; aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Bağlanıyor…</span>
  </div>

  <div class="app-body">
    <main class="preview-pane">
      <div id="ytRow" class="row"></div>
      <div id="vRow" class="row"></div>
      <div id="otherRow" class="row"></div>
    </main>
  </div>

  <script async defer src="https://www.instagram.com/embed.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

  <script>
    const CONFIG = {
      pusherKey: '34bf7a0ff419a2a775b9',
      pusherCluster: 'us2',
      chatroomId: 27644613,
      allowedSenderId: 28966226,
      maxYoutube: 4,
      maxVertical: 6,
      maxReconnectAttempts: 8,
    };

    const pane       = document.querySelector('.preview-pane');
    const ytRow      = document.getElementById('ytRow');      // YouTube (en üstte)
    const vRow       = document.getElementById('vRow');       // TikTok + Reels (yan yana)
    const otherRow   = document.getElementById('otherRow');   // Twitter, Steam, Discord
    const statusDot  = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const URL_REGEX       = /(https?:\/\/[^\s<>"']+)/gi;
    const YOUTUBE_REGEX   = /(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|embed\/|live\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i;
    const TIKTOK_REGEX    = /tiktok\.com\/(?:@[\w.-]+\/video\/(\d+)|v\/(\d+))/i;
    const INSTAGRAM_REGEX = /instagram\.com\/(p|reel|reels|tv)\/([a-zA-Z0-9_-]+)/i;
    const TWITTER_REGEX   = /(?:twitter\.com|x\.com)\/(?:#!\/)?(?:\w+)\/status(?:es)?\/(\d+)/i;
    const STEAM_REGEX     = /(?:store\.steampowered\.com|steamcommunity\.com)\/app\/(\d+)/i;
    const STEAM_IMG_REGEX = /steamstatic\.com\/(?:store_item_assets\/)?steam\/apps\/(\d+)\/[^\s]*?\.(?:jpg|jpeg|png|webp|gif)/i;
    const DISCORD_REGEX   = /(?:cdn\.discordapp\.com|media\.discordapp\.net)\/attachments\/\d+\/\d+\/[^\s?]+/i;

    let pusher = null, channel = null, reconnectAttempts = 0, reconnectTimer = null;

    function setStatus(state, text) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = text;
    }

    function initPusher() {
      clearTimeout(reconnectTimer);
      setStatus('', 'Bağlanıyor…');
      pusher = new Pusher(CONFIG.pusherKey, {
        cluster: CONFIG.pusherCluster,
        forceTLS: true,
        enabledTransports: ['ws', 'wss'],
      });

      pusher.connection.bind('connected', () => {
        reconnectAttempts = 0;
        setStatus('connected', 'Bağlı');
      });
      pusher.connection.bind('disconnected', () => {
        setStatus('disconnected', 'Bağlantı koptu');
        scheduleReconnect();
      });
      pusher.connection.bind('error', () => {
        setStatus('disconnected', 'Hata');
        scheduleReconnect();
      });

      channel = pusher.subscribe(`chatrooms.${CONFIG.chatroomId}.v2`);
      channel.bind('App\\Events\\ChatMessageEvent', (payload) => {
        try {
          const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
          handleIncomingMessage(data);
        } catch (_) {}
      });
    }

    function scheduleReconnect() {
      if (reconnectAttempts >= CONFIG.maxReconnectAttempts) return;
      reconnectAttempts++;
      const delay = Math.min(2000 * reconnectAttempts, 15000);
      reconnectTimer = setTimeout(() => {
        if (pusher) { try { pusher.connect(); } catch (_) { initPusher(); } }
        else initPusher();
      }, delay);
    }

    const DEBUG = new URLSearchParams(location.search).has('debug');
    function dbg(...a) { console.log('[preview]', ...a); }

    function handleIncomingMessage(data) {
      if (DEBUG) dbg('mesaj', data && data.sender && data.sender.id, data && data.content);
      if (!data || !data.sender) return;
      if (Number(data.sender.id) !== CONFIG.allowedSenderId) {
        if (DEBUG) dbg('gönderen izinli değil:', data.sender.id);
        return;
      }

      const links = (data.content || '').match(URL_REGEX);
      if (DEBUG) dbg('bulunan linkler:', links);
      if (!links) return;

      links.forEach((rawLink) => {
        const url = rawLink.replace(/[.,!?;:)\]]+$/, '');

        const yt = url.match(YOUTUBE_REGEX);
        if (yt) { addYoutubeCard(yt[1], url); return; }

        const tt = url.match(TIKTOK_REGEX);
        if (tt) { addTikTokCard(tt[1] || tt[2], url); return; }

        const ig = url.match(INSTAGRAM_REGEX);
        if (ig) {
          let igType = ig[1];
          if (igType === 'reels') igType = 'reel';
          addInstagramCard(igType, ig[2], url);
          return;
        }

        const tw = url.match(TWITTER_REGEX);
        if (tw) { addTwitterCard(tw[1], url); return; }

        const si = url.match(STEAM_IMG_REGEX);
        if (si) { addSteamImageCard(url, si[1]); return; }

        const st = url.match(STEAM_REGEX);
        if (st) { addSteamCard(st[1], url); return; }

        const dc = url.match(DISCORD_REGEX);
        if (dc) { addDiscordCard(url); return; }
      });
    }

    function addYoutubeCard(videoId, originalUrl) {
      const card = document.createElement('a');
      card.className = 'yt-card';
      card.href = originalUrl;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const hiRes    = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
      const fallback = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

      card.innerHTML = `
        <div class="yt-thumb">
          <img src="${hiRes}" onerror="this.onerror=null;this.src='${fallback}'" alt="">
        </div>
        <div class="yt-info">
          <div class="yt-title">Yükleniyor…</div>
          <div class="yt-author"></div>
        </div>`;

      ytRow.prepend(card);

      fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`)
        .then((r) => r.ok ? r.json() : null)
        .then((info) => {
          if (!info) return;
          card.querySelector('.yt-title').textContent  = info.title || '';
          card.querySelector('.yt-author').textContent = info.author_name || '';
        })
        .catch(() => {});
    }

    function addTikTokCard(videoId, originalUrl) {
      const card = document.createElement('div');
      card.className = 'v-card';

      const params = new URLSearchParams({
        autoplay: 0, loop: 0, volume_control: 0, timestamp: 0,
      });

      card.innerHTML = `
        <iframe src="https://www.tiktok.com/player/v1/${videoId}?${params.toString()}"
          width="220" height="391"
          allow="encrypted-media; fullscreen; picture-in-picture"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          title="TikTok Video"></iframe>`;
      addOpenButton(card, originalUrl || `https://www.tiktok.com/player/v1/${videoId}`);

      vRow.prepend(card);
    }

    function addInstagramCard(type, shortcode, originalUrl) {
      const card = document.createElement('div');
      card.className = 'v-card';

      const blockquote = document.createElement('blockquote');
      blockquote.className = 'instagram-media';
      blockquote.setAttribute('data-instgrm-permalink',
        `https://www.instagram.com/${type}/${shortcode}/`);
      blockquote.setAttribute('data-instgrm-version', '14');
      blockquote.style.margin = '0';
      blockquote.style.width = '100%';

      card.appendChild(blockquote);
      addOpenButton(card, originalUrl || `https://www.instagram.com/${type}/${shortcode}/`);
      vRow.prepend(card);

      processInstagramEmbeds();
    }

    function processInstagramEmbeds() {
      let tries = 0;
      const timer = setInterval(() => {
        if (window.instgrm && window.instgrm.Embeds) {
          window.instgrm.Embeds.process();
          clearInterval(timer);
        } else if (++tries > 30) {
          clearInterval(timer);
        }
      }, 400);
    }

    function addTwitterCard(tweetId, originalUrl) {
      const card = document.createElement('div');
      card.className = 'tw-card';

      const container = document.createElement('div');
      container.className = 'twitter-container';
      card.appendChild(container);
      addOpenButton(card, originalUrl || `https://x.com/i/status/${tweetId}`);

      otherRow.prepend(card);

      waitForTwitter(() => {
        if (window.twttr && window.twttr.widgets) {
          window.twttr.widgets.createTweet(tweetId, container, {
            theme: 'dark',
            dnt: true,
            width: 300,
            align: 'center',
          }).catch(() => {});
        }
      });
    }

    function waitForTwitter(callback) {
      if (window.twttr && window.twttr.widgets) { callback(); return; }
      let tries = 0;
      const timer = setInterval(() => {
        if (window.twttr && window.twttr.widgets) {
          clearInterval(timer);
          callback();
        } else if (++tries > 40) {
          clearInterval(timer);
        }
      }, 300);
    }

    /* ---------- STEAM ---------- */

    // Steam appdetails API CORS izni vermez; bu yüzden proxy üzerinden çekiyoruz.
    const STEAM_PROXIES = [
      (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
      (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    ];

    async function fetchSteamDetails(appId) {
      const apiUrl = `https://store.steampowered.com/api/appdetails?appids=${appId}&l=turkish`;
      for (const build of STEAM_PROXIES) {
        try {
          const r = await fetch(build(apiUrl));
          if (!r.ok) continue;
          const json = await r.json();
          const entry = json && json[appId];
          if (entry && entry.success && entry.data) return entry.data;
        } catch (_) {}
      }
      return null;
    }

    async function fetchSteamOgImage(appId) {
      const pageUrl = `https://store.steampowered.com/app/${appId}/?l=english`;
      for (const build of STEAM_PROXIES) {
        try {
          const r = await fetch(build(pageUrl));
          if (!r.ok) continue;
          const html = await r.text();
          const m = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/i)
                 || html.match(/<meta\s+content=["']([^"']+)["']\s+property=["']og:image["']/i);
          if (m) return m[1].replace(/&amp;/g, '&');
        } catch (_) {}
      }
      return null;
    }

    // Doğrudan Steam CDN görsel adresi atıldığında
    function addSteamImageCard(imageUrl, appId) {
      const card = document.createElement('a');
      card.className = 'steam-card';
      card.href = `https://store.steampowered.com/app/${appId}/`;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const placeholder = document.createElement('div');
      placeholder.className = 'steam-placeholder';
      placeholder.textContent = 'Steam Oyunu';

      const img = document.createElement('img');
      img.alt = 'Steam Oyunu';
      img.referrerPolicy = 'no-referrer';
      img.onload = () => { placeholder.style.display = 'none'; };

      const cleanUrl = imageUrl.split('?')[0];
      img.onerror = () => {
        if (img.src !== cleanUrl) { img.src = cleanUrl; return; }
        img.onerror = null;
        img.style.display = 'none';
      };
      img.src = imageUrl;

      card.appendChild(placeholder);
      card.appendChild(img);
      otherRow.prepend(card);
    }

    function addSteamCard(appId, originalUrl) {
      const card = document.createElement('a');
      card.className = 'steam-card';
      card.href = `https://store.steampowered.com/app/${appId}/`;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const img = document.createElement('img');
      img.alt = 'Steam Oyunu';
      img.referrerPolicy = 'no-referrer';
      img.decoding = 'async';
      img.style.display = 'none';

      const placeholder = document.createElement('div');
      placeholder.className = 'steam-placeholder';
      placeholder.textContent = 'Steam Oyunu';

      card.appendChild(placeholder);
      card.appendChild(img);
      otherRow.prepend(card);

      img.onload = () => {
        img.style.display = 'block';
        placeholder.style.display = 'none';
      };

      const urls = [
        `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${appId}/header.jpg`,
        `https://cdn.akamai.steamstatic.com/steam/apps/${appId}/header.jpg`,
        `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/header.jpg`,
        `https://steamcdn-a.akamaihd.net/steam/apps/${appId}/header.jpg`,
        `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/capsule_616x353.jpg`,
        `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/capsule_467x181.jpg`,
        `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/capsule_231x87.jpg`,
      ];

      let idx = 0;
      let apiTried = false;

      const tryNext = async () => {
        if (idx < urls.length) {
          img.src = urls[idx++];
          return;
        }
        // Doğrudan adreslerin hepsi başarısız: API'den gerçek adresi al
        if (!apiTried) {
          apiTried = true;
          const data = await fetchSteamDetails(appId);
          if (data) {
            if (data.name) {
              card.title = data.name;
              placeholder.textContent = data.name;
            }
            const apiImgs = [data.header_image, data.capsule_image, data.capsule_imagev5]
              .filter(Boolean);
            if (apiImgs.length) {
              urls.push(...apiImgs);
              tryNext();
              return;
            }
          }
        }
        const og = await fetchSteamOgImage(appId);
        if (og) {
          img.onerror = () => {
            img.onerror = null;
            img.style.display = 'none';
            placeholder.style.display = 'flex';
          };
          img.src = og;
          return;
        }
        img.onerror = null;
        img.style.display = 'none';
        placeholder.style.display = 'flex';
      };

      img.onerror = tryNext;
      tryNext();

      // Oyun adını arka planda al (görsel yüklense bile tooltip için)
      if (!card.title) {
        fetchSteamDetails(appId).then((data) => {
          if (data && data.name) {
            card.title = data.name;
            if (placeholder.style.display !== 'none') placeholder.textContent = data.name;
          }
        });
      }
    }

    /* ---------- DISCORD ---------- */

    function addDiscordCard(imageUrl) {
      const card = document.createElement('div');
      card.className = 'discord-card';

      const cleanUrl = imageUrl.split('?')[0];
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = () => {
        img.onerror = null;
        img.src = cleanUrl;
      };

      card.appendChild(img);
      card.addEventListener('click', () => openFullscreen(imageUrl, cleanUrl));
      otherRow.prepend(card);
    }

    function openFullscreen(primaryUrl, fallbackUrl) {
      const existing = document.querySelector('.fullscreen-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.className = 'fullscreen-overlay';

      const img = document.createElement('img');
      img.src = primaryUrl;
      img.alt = '';
      img.onerror = () => {
        img.onerror = null;
        img.src = fallbackUrl;
      };

      const closeBtn = document.createElement('button');
      closeBtn.className = 'fullscreen-close';
      closeBtn.innerHTML = '✕';

      const close = () => overlay.remove();
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      document.addEventListener('keydown', function onKey(e) {
        if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }
      });

      overlay.appendChild(img);
      overlay.appendChild(closeBtn);
      document.body.appendChild(overlay);
    }

    // Tıklanınca kart siyah-beyaz + soluk olur, 20 sn sonra otomatik silinir
    const REMOVE_AFTER_MS = 20000;

    function markClicked(e) {
      const el = e.target.closest('a.yt-card, a.steam-card, .discord-card, .open-btn');
      if (!el) return;
      const card = el.closest('.yt-card, .steam-card, .discord-card, .v-card, .tw-card');
      if (!card || card._timer) return;
      card.classList.add('clicked');
      card._timer = setTimeout(() => {
        card.classList.add('leaving');
        setTimeout(() => card.remove(), 400);
      }, REMOVE_AFTER_MS);
    }
    pane.addEventListener('click', markClicked);
    pane.addEventListener('auxclick', markClicked);

    // TikTok / Instagram / Twitter gömmelerine "yeni sekmede aç" düğmesi
    function addOpenButton(card, url) {
      const a = document.createElement('a');
      a.className = 'open-btn';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = 'Yeni sekmede aç';
      a.textContent = '↗';
      card.appendChild(a);
    }

    // Test modu: sayfa adresinin sonuna ?test ekle, sohbet olmadan Steam kartını dener
    if (new URLSearchParams(location.search).has('test')) {
      addSteamImageCard(
        'https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4656000/99c086faba625a8d3bc459bab444087d257ccbe1/header.jpg?t=1792877964',
        '4656000'
      );
      addSteamCard('4656000', 'https://store.steampowered.com/app/4656000/');
    }

    initPusher();
  </script>
</body>
</html>
